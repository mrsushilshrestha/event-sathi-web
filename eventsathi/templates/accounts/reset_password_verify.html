{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="auth-card" style="max-width:480px;">
            <div class="text-center mb-4">
                <div class="auth-logo mb-2 d-flex align-items-center justify-content-center">
                    <img src="{% static 'images/logo.png' %}" alt="EventSathi" style="height: 48px; width: auto;" class="me-2">
                    <span>Event-Sathi</span>
                </div>
                <h4 class="fw-bold">Enter OTP</h4>
                <p class="text-muted small">We've sent a 6-digit OTP to <br><strong class="text-white">{{ target_user.email }}</strong></p>
            </div>

            <form method="post" novalidate class="mb-3">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-center d-block fw-semibold mb-3">OTP</label>
                    <input type="text" name="code" class="form-control text-center fw-bold fs-4" placeholder="123456" maxlength="6" required autocomplete="off" style="letter-spacing: 8px; font-family: monospace;">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-semibold">
                    <i class="bi bi-patch-check me-2"></i>Verify OTP
                </button>
            </form>

            <form method="post" novalidate class="text-center mt-4">
                {% csrf_token %}
                <input type="hidden" name="action" value="resend">
                <p class="text-muted small mb-1">Didn't receive the code?</p>
                <button type="submit" class="btn btn-link text-decoration-none fw-semibold p-0" style="color:var(--es-primary); font-size: 0.875rem;">
                    <i class="bi bi-arrow-clockwise me-1"></i>Resend OTP
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
